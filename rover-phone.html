<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#211a36">
  <title>Lookout Rover · Phone camera</title>
  <style>
    :root { color-scheme: dark; background: #211a36; color: #f5f3fc; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; margin: 12vh auto; padding: 1.25rem; }
    a { display: inline-block; background: #e6d6fa; color: #211a36; border-radius: .6rem; padding: .65rem .9rem; font-weight: 650; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Lookout Rover</h1>
    <p id="message" role="status">Open your saved phone link or scan the QR code in Lookout Rover.</p>
    <a id="open-camera" hidden rel="noreferrer">Open rear camera</a>
  </main>
  <script src="phone-video.js?v=4"></script>
  <script>
    const api = window.LookoutPhoneVideo;
    const pairing = api?.fromBookmark(location.hash);
    if (pairing) {
      const url = api.relayUrl(pairing, true);
      const button = document.getElementById("open-camera");
      button.href = url;
      button.hidden = false;
      document.getElementById("message").textContent = "Opening the rear camera. Allow camera access when Safari asks.";
      // Use a top-level page so Safari can request camera permission directly.
      window.location.replace(url);
    }
  </script>
</body>
</html>
